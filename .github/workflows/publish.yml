name: Publish Python Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: pypi               
      url: https://pypi.org/project/pyCoastal
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tool
        run: python -m pip install --upgrade pip build
      - name: Verify the tag matches the packaged version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG  pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $PKG. Refusing to publish."
            exit 1
          fi
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Upload distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
